name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ncs-santhanam

jobs:
  test:
    name: Lint, typecheck, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ncs-santhanam/package-lock.json

      - name: Start backing services (Postgres, Redis, S3, Mailpit)
        run: docker compose up -d --wait postgres redis s3 mailpit

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env

      - run: npm ci

      - name: Migrate dev database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build && npm run worker:build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ncs-santhanam/playwright-report
            ncs-santhanam/test-results
          retention-days: 7

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ncs-santhanam
          target: runtime
          push: false
          tags: ncs-santhanam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: ncs-santhanam
          target: migrate
          push: false
          tags: ncs-santhanam-migrate:ci
          cache-from: type=gha

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ncs-santhanam/infra/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

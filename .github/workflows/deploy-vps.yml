name: Deploy to VPS

# Builds the images, pushes them to GitHub Container Registry and releases them on the
# server with ncs-santhanam/infra/vps/deploy.sh (rolling, zero-downtime, auto-rollback).
#
# Requires (repository settings → Secrets and variables → Actions):
#   vars.DEPLOY_TARGET      "vps" turns this workflow on ("aws" uses deploy.yml instead)
#   vars.MEDIA_PUBLIC_URL   public media base URL baked into next/image (= S3_PUBLIC_URL)
#   vars.APP_URL            optional, e.g. https://ncsanthanam.in — checked after each release
#   vars.VPS_APP_DIR        optional, defaults to /opt/ncs
#   secrets.VPS_HOST        server IP or hostname
#   secrets.VPS_USER        user created by infra/vps/bootstrap.sh ("deploy")
#   secrets.VPS_SSH_KEY     that user's private key (dedicated ed25519 key, used only by CI)
#   secrets.VPS_KNOWN_HOSTS the server's host key line (printed by bootstrap.sh)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ vars.DEPLOY_TARGET == 'vps' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/ncs' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Image names
        id: img
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ncs-santhanam"
          echo "app=${repo}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "migrate=${repo}-migrate:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push app image
        uses: docker/build-push-action@v7
        with:
          context: ncs-santhanam
          target: runtime
          push: true
          build-args: S3_PUBLIC_URL=${{ vars.MEDIA_PUBLIC_URL }}
          tags: ${{ steps.img.outputs.app }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push migrate image
        uses: docker/build-push-action@v7
        with:
          context: ncs-santhanam
          target: migrate
          push: true
          tags: ${{ steps.img.outputs.migrate }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Sync deployment files
        run: |
          # shellcheck disable=SC2029 # paths are meant to expand on the runner
          tar -C ncs-santhanam -czf - docker-compose.prod.yml infra/caddy infra/backup infra/vps infra/seaweedfs \
            | ssh vps "mkdir -p '$APP_DIR' && tar -xzf - -C '$APP_DIR' && chmod +x '$APP_DIR/infra/vps/deploy.sh'"

      - name: Release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ steps.img.outputs.app }}
          MIGRATE_IMAGE: ${{ steps.img.outputs.migrate }}
        run: |
          # Short-lived registry login: the job token stops working when this job ends.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          # shellcheck disable=SC2029 # image names are meant to expand on the runner
          ssh vps "cd '$APP_DIR' && infra/vps/deploy.sh '$APP_IMAGE' '$MIGRATE_IMAGE'"

      - name: Registry logout
        if: always()
        run: ssh vps "docker logout ghcr.io >/dev/null 2>&1 || true" || true

      - name: Check the live site
        if: ${{ vars.APP_URL != '' }}
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "${{ vars.APP_URL }}/api/ready"

# ─────────────────────────────────────────────────────────────
# Production stack for a single VPS (scale app/worker replicas as traffic grows).
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --scale app=4
#
# Releases from CI go through infra/vps/deploy.sh (rolling, zero-downtime, auto-rollback).
#
# For AWS (managed Postgres/Redis/S3, autoscaling) use infra/terraform/aws instead.
# ─────────────────────────────────────────────────────────────
name: ncs-prod

x-app-env: &app-env
  env_file: .env.production
  environment:
    NODE_ENV: production
    # App traffic goes through PgBouncer; migrations connect to Postgres directly.
    DATABASE_URL: postgresql://${POSTGRES_USER:-ncs}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-ncs}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  app:
    <<: *app-env
    build: { context: ., target: runtime, args: { S3_PUBLIC_URL: "${S3_PUBLIC_URL}" } }
    image: ${APP_IMAGE:-ncs-santhanam:latest}
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources: { limits: { memory: 768M } }
    expose: ["3000"]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  worker:
    <<: *app-env
    image: ${APP_IMAGE:-ncs-santhanam:latest}
    command: ["node", "worker.mjs"]
    # Lets in-flight jobs (emails, invoices) finish before the container is replaced.
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ncs}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-ncs}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      HEALTH_PORT: "3001"
      HEALTH_PATH: ""
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources: { limits: { memory: 512M } }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrate:
    build: { context: ., target: migrate }
    image: ${MIGRATE_IMAGE:-ncs-santhanam-migrate:latest}
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ncs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ncs}
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ncs}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncs} -d ${POSTGRES_DB:-ncs}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Connection pooler: lets many app replicas share a small pool of Postgres connections.
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.26.0-p0}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-ncs}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-ncs}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Optional self-hosted S3. Skip this profile and point S3_* at AWS S3 / Cloudflare R2 instead.
  s3:
    profiles: [selfhosted-storage]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.prod.json:/etc/seaweedfs/s3.json:ro

  # Nightly logical backups: 14 days on the server, plus off-site copies when BACKUP_S3_* is set.
  backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-ncs}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ncs}
      RETENTION_DAYS: "14"
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-ncs}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-30}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  s3data:
  backups:
  caddy_data:
  caddy_config:
